<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236A5AE0'/%3E%3Cstop offset='1' stop-color='%23B45CF0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='34' height='34' rx='10' fill='url%28%23g%29'/%3E%3Cpath d='M12 25V9h5.6a5 5 0 0 1 0 10H12' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 19l6 6' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3Cpath d='M19.2 25.4h4.2v-4.2' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>RELOOP – Reselling-Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try { const t = localStorage.getItem('rl-theme'); const d = t === 'dark' || ((!t || t === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {}
</script>
<style>
:root{
  --bg:#F4F5F9; --panel:#FFFFFF; --panel-2:#F7F8FB; --ink:#14151B; --ink-2:#3A3D48; --muted:#6C7183; --line:#E3E6EE; --line-2:#EDEFF5;
  --accent:#6A5AE0; --accent-2:#B45CF0; --accent-ink:#FFFFFF; --accent-soft:#EEEBFE; --accent-ink-soft:#4A3BC2;
  --ok:#14915A; --ok-soft:#DCF3E7; --warn:#B87A07; --warn-soft:#FBF0D6; --bad:#D03F4A; --bad-soft:#FBE3E5; --info:#2F6BD8; --info-soft:#E3ECFC;
  --shadow:0 1px 2px rgba(20,21,27,.04),0 8px 28px rgba(20,21,27,.06);
  --shadow-lg:0 12px 40px rgba(20,21,27,.12);
  --r:20px; --r-sm:12px;
  --font:'Geist',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --display:'Geist','Bricolage Grotesque',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --chart-1:#6A5AE0; --chart-2:#14151B; --chart-3:#14915A; --chart-grid:#E8EAF1;
}
[data-theme="dark"]{
  --bg:#0D0E13; --panel:#15161D; --panel-2:#1B1C25; --ink:#F1F2F6; --ink-2:#CDD0DA; --muted:#8E93A4; --line:#262834; --line-2:#1F212B;
  --accent:#8B7DFF; --accent-2:#C77DFF; --accent-ink:#FFFFFF; --accent-soft:#25214A; --accent-ink-soft:#C9C1FF;
  --ok:#3CC384; --ok-soft:#13301F; --warn:#E9B142; --warn-soft:#352A12; --bad:#F06A73; --bad-soft:#3A1A1E; --info:#7FA6F0; --info-soft:#18243A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --chart-1:#8B7DFF; --chart-2:#F1F2F6; --chart-3:#3CC384; --chart-grid:#242632;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--line);background:var(--panel-2);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand svg{flex:none}
.brand b{font:800 21px/1 var(--display);letter-spacing:-.02em}
.brand small{display:block;font:500 11px/1.2 var(--font);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.nav button{display:flex;width:100%;align-items:center;gap:11px;padding:9px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav button.on svg{stroke:var(--bg)}
.nav button .count{margin-left:auto;font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:auto;padding:12px 6px 0;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.theme-switch{display:flex;background:var(--line-2);border-radius:10px;padding:3px}
.theme-switch button{flex:1;border:0;background:none;padding:5px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--muted)}
.theme-switch button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
/* Main */
.main{min-width:0;padding:28px 36px 80px;max-width:1360px}
.top{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font:700 30px/1.1 var(--display);letter-spacing:-.025em;margin:0}
.page-head p{margin:6px 0 0;color:var(--muted);max-width:720px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 12px;font:600 16px/1.3 var(--font);letter-spacing:-.005em}
.card h2{font:700 18px/1.2 var(--display);letter-spacing:-.015em}
.card .sub{color:var(--muted);font-size:13px;margin:-6px 0 14px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font:700 26px/1.15 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.accent .l,.kpi.accent .s{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .mono{font-family:var(--mono)} .num{font-variant-numeric:tabular-nums}
.right{text-align:right}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s,opacity .15s;white-space:nowrap}
a.btn{text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:46px;padding:0 20px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
label.f > span{display:flex;align-items:center;gap:6px}
.in,select.in,textarea.in{width:100%;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 11px;color:var(--ink);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;min-height:90px;padding:10px 11px;line-height:1.5;resize:vertical}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.ai{background:color-mix(in srgb,var(--info-soft) 55%,var(--panel))}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fgrid .span2{grid-column:span 2} .fgrid .span4{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent);width:100%}
/* Chips, badges */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.accent{background:var(--accent-soft);color:var(--accent-ink-soft)}
.ai-badge{font:600 10px/1 var(--mono);padding:3px 5px;border-radius:5px;background:var(--info-soft);color:var(--info);letter-spacing:.03em}
.note{border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.note.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent);color:var(--ink)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--ink)}
.note b{font-weight:600}
/* Tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.sortable{cursor:pointer} .tbl th.sortable:hover{color:var(--ink)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl tr.sel{background:var(--accent-soft)}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--line-2);display:block;flex:none}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-size:11px}
.thumb.ph svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-weight:600;text-align:left}
.link:hover{color:var(--accent)}
/* Steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.steps button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:40px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.steps button i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line-2);font:600 12px var(--mono)}
.steps button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.steps button.on i{background:var(--accent);color:var(--accent-ink)}
.steps button.done i{background:var(--ok);color:#fff}
/* Upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;background:var(--panel);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font:700 20px var(--display);margin:12px 0 4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery .g{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2);aspect-ratio:1}
.gallery .g img{width:100%;height:100%;object-fit:cover;display:block;background:repeating-conic-gradient(var(--line-2) 0 25%,transparent 0 50%) 0 0/16px 16px}
.gallery .g .tag{position:absolute;left:6px;top:6px}
.gallery .g[data-gi]{cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gallery .g.dragging{opacity:.55;outline:2px solid var(--accent);outline-offset:-2px;cursor:grabbing}
.gallery.sorting .g .acts{opacity:0!important}
.gallery .g .gnum{position:absolute;right:6px;top:6px;min-width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.gallery .g .acts{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.gallery .g:hover .acts{opacity:1}
@media (hover:none){.gallery .g .acts{opacity:1}}
.icon-btn{width:30px;height:30px;border-radius:8px;border:0;background:rgba(17,17,17,.75);color:#fff;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Price tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tier{min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel-2);cursor:pointer;transition:border-color .15s,transform .15s}
.tier:hover{border-color:var(--muted)}
.tier.on{border-color:var(--accent);background:var(--accent-soft)}
.tier .t{font-size:12.5px;color:var(--muted);font-weight:600}
.tier .p{font:800 clamp(19px,2.1vw,28px)/1.1 var(--display);margin:6px 0 2px;letter-spacing:-.02em;white-space:nowrap}
.grid > *{min-width:0}
.factors{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.factors li{position:relative;padding:7px 10px 7px 24px;border-radius:10px;background:var(--line-2);font-size:12.5px;line-height:1.4;color:var(--ink-2);overflow-wrap:anywhere}
.factors li::before{content:'';position:absolute;left:10px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tier .d{font-size:12.5px;color:var(--muted)}
/* Studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.canvas-wrap{position:relative;background:repeating-conic-gradient(var(--line-2) 0 25%,var(--panel) 0 50%) 0 0/20px 20px;border:1px solid var(--line);border-radius:var(--r);min-height:420px;display:grid;place-items:center;overflow:hidden}
.canvas-wrap canvas{max-width:100%;max-height:70vh;display:block}
.canvas-wrap .ov{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--panel) 75%,transparent);backdrop-filter:blur(2px)}
.ctrl h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ctrl h4:first-child{margin-top:0}
.sl{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.sl output{font:12px var(--mono);color:var(--muted);text-align:right}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:9px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
/* Spinner */
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading-line{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,12,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:var(--panel);border-radius:18px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h2{margin:0 0 6px;font:700 20px var(--display);letter-spacing:-.015em}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:11px 15px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:380px;animation:fade .2s}
.toast.bad{background:var(--bad);color:#fff}
/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:460px}
.chat-log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:78%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-in{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.chat-in textarea{min-height:46px;height:46px}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.suggest button:hover{border-color:var(--accent);color:var(--ink)}
.proposal{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2);font-size:13.5px}
/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font:700 19px var(--display);margin:10px 0 4px}
.list-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.ellipsis{display:block;max-width:100%;text-align:left}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}
.tabs-inline{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs-inline button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-inline button.on{color:var(--ink);border-bottom-color:var(--accent)}
.copybox{position:relative}
.copybox .cnt{position:absolute;right:10px;top:-22px;font:11px var(--mono);color:var(--muted)}
.blocker{max-width:560px;margin:12vh auto;text-align:center}
.show-m{display:none !important}
/* Tab-Leiste unten (nur Handy) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;grid-template-columns:repeat(6,1fr);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;min-width:0;white-space:nowrap;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}
.tabbar button.plus span.circle{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.tabbar button.plus svg{stroke:var(--accent-ink);width:24px;height:24px}
.tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font:600 10px var(--mono);border-radius:10px;padding:0 5px}
.inv-cards{display:none;flex-direction:column;gap:8px}
.inv-card{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.inv-card.sel{border-color:var(--accent);background:var(--accent-soft)}
.inv-card .thumb{width:60px;height:60px}
.inv-card input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.app > div{min-width:0}
/* ===== Modernes Design (v2) ===== */
body{background:radial-gradient(900px 420px at 85% -120px,color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%),radial-gradient(700px 360px at 30% -160px,color-mix(in srgb,var(--accent-2) 8%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.side{background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px}
.brand{padding:4px 8px 22px}
.brand b{font:800 20px/1 var(--display);letter-spacing:-.03em}
.brand small{letter-spacing:.06em}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;padding:16px 12px 6px}
.nav button{border-radius:12px;padding:10px 12px;font-weight:550;position:relative}
.nav button:hover{background:var(--line-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink-soft)}
.nav button.on svg{stroke:var(--accent)}
.nav button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav button .count{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-radius:20px;padding:1px 7px}
.theme-switch{border-radius:12px}
.main{padding:32px 40px 80px}
.page-head{margin-bottom:26px}
.page-head h1{font:750 32px/1.1 var(--display);letter-spacing:-.035em}
.page-head p{font-size:14.5px}
.card{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.card h2{font:700 17px/1.25 var(--display);letter-spacing:-.02em}
.kpi{padding:18px 20px}
.kpi .l{font-size:12.5px;font-weight:550}
.kpi .v{font:750 27px/1.15 var(--display);letter-spacing:-.03em}
.kpi.accent{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-color:transparent;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 30%,transparent)}
.kpi.accent .l,.kpi.accent .s{color:rgba(255,255,255,.82)}
.btn{border-radius:12px;font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 36%,transparent)}
.btn.sm{border-radius:10px}
.in,select.in,textarea.in{background:var(--panel-2);border-color:var(--line);border-radius:12px;height:40px}
textarea.in{height:auto}
.in:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
.in:focus{background:var(--panel);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.chip{border-radius:999px}
.note{border-radius:14px}
.tbl-wrap{border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow);border-radius:var(--r)}
.tbl th{background:var(--panel);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.steps button{border-radius:999px}
.steps button.on{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.steps button.on i{background:#fff;color:var(--accent)}
.seg{border-radius:12px;background:var(--line-2)}
.seg button{border-radius:9px}
.tabs-inline button.on{border-bottom-color:var(--accent);color:var(--accent-ink-soft)}
.msg.u{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.modal{border-radius:22px;box-shadow:var(--shadow-lg)}
.modal-bg{background:rgba(12,12,20,.45);backdrop-filter:blur(4px)}
.toast{border-radius:14px;box-shadow:var(--shadow-lg)}
.drop{border-radius:var(--r);background:color-mix(in srgb,var(--panel) 70%,transparent)}
.proposal{border-radius:14px}
.tier{border-radius:16px}
.inv-card{border-radius:16px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--line) 70%,transparent)}
.tabbar button.on{color:var(--accent)}
.tabbar button.plus span.circle{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
/* Einstellungen als aufklappbare Bereiche */
.acc{display:flex;flex-direction:column;gap:10px;max-width:980px}
.acc-item{background:var(--panel);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.acc-item.open{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 10px 32px color-mix(in srgb,var(--accent) 10%,transparent)}
.acc-head{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:16px 18px;cursor:pointer;text-align:left;color:var(--ink)}
.acc-head:hover{background:var(--panel-2)}
.acc-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);flex:none}
.acc-ic svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-t b{font:650 15.5px/1.25 var(--display);letter-spacing:-.01em}
.acc-t small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-chev svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.acc-item.open .acc-chev svg{transform:rotate(90deg);stroke:var(--accent)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc-item.open .acc-body{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0;padding:0 18px;visibility:hidden;transition:visibility .28s}
.acc-item.open .acc-in{visibility:visible}
.acc-item.open .acc-in{padding:4px 18px 20px;border-top:1px solid var(--line-2);padding-top:16px}
.acc-in > .sub:first-child{margin-top:0}
.acc-in .card{box-shadow:none;border:0;padding:0}
/* Responsive */
@media (max-width:1180px){.g6{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(2,1fr)} .studio{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 14px;border-bottom:1px solid var(--line)}
  .top b{font:800 18px var(--display)}
  .main{padding:18px 14px 80px}
  .g2,.g3,.g-main,.tiers{grid-template-columns:1fr}
  .g6,.g4{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-head h1{font-size:25px}
  .msg{max-width:92%}
  .hide-m{display:none}
  .show-m{display:inline-flex !important}
  /* Handy: Eingaben ohne Auto-Zoom, Touch-Ziele groß */
  .in,select.in,textarea.in{font-size:16px}
  .btn{min-height:40px}
  .btn.sm{min-height:34px}
  .main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .top{padding-top:calc(10px + env(safe-area-inset-top))}
  .page-head{margin-bottom:14px}
  .page-head > .row{width:100%}
  .page-head > .row .btn.primary{flex:1}
  .card{padding:16px;border-radius:16px}
  .acc-head{padding:14px}
  .acc-ic{width:36px;height:36px}
  .acc-item.open .acc-in{padding:14px 14px 16px}
  .nav button.on::before{display:none}
  .kpi .v{font-size:21px}
  .steps{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps button{flex:none}
  .seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .seg button{flex:none}
  .tabs-inline{flex-wrap:nowrap;overflow-x:auto}
  .tabs-inline button{flex:none}
  .modal-bg{align-items:end;padding:0}
  .modal{width:100% !important;max-height:92vh;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sheet .22s ease}
  @keyframes sheet{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .modal .acts{position:sticky;bottom:0;background:var(--panel);padding-top:10px}
  .modal .acts .btn{flex:1}
  .toasts{left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom))}
  .toast{max-width:none}
  .inv-table-desk{display:none}
  .inv-cards{display:flex !important}
  .canvas-wrap{min-height:280px}
  .canvas-wrap canvas{max-height:56vh}
  .chart-box{height:220px}
  .chat{height:calc(100vh - 230px)}
  .tiers .tier .p{font-size:24px}
  .item-head{flex-direction:column;align-items:stretch !important}
  .item-head .row{width:100%}
  .item-head label.f{flex:1}
  .tabbar{display:grid}
  .drop{padding:30px 16px}
}
@media (max-width:480px){
  .fgrid{grid-template-columns:1fr 1fr}
  .g6,.g4{grid-template-columns:1fr 1fr}
  .page-head h1{font-size:23px}
  .gallery{grid-template-columns:repeat(3,1fr)}
}
